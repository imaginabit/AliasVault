# MyVault - Custom compose for all-in-one deployment
# Copy this file to docker-compose.yml and edit before deploying.
# Usage: docker compose -f docker-compose.custom.yml up -d

services:
  myvault:
    image: ghcr.io/your-org/myvault:latest
    container_name: myvault
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "25:25"
      - "587:587"
    volumes:
      - ./database:/database
      - ./logs:/logs
      - ./secrets:/secrets
      - ./certificates:/certificates
    environment:
      FORCE_HTTPS_REDIRECT: "false"
      PUBLIC_REGISTRATION_ENABLED: "true"