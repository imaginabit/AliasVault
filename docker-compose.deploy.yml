# Deploy this file after building and pushing images to your registry.
# Edit the image names and hostname before deploying.
#
# Usage:
#   1. Edit BRANCH below for the variant you want (all-in-one, multi-container, nas)
#   2. Replace docker image names with your own built images
#   3. Set ALLOWED_HOSTS to your actual domain
#   4. Run: docker compose -f docker-compose.deploy.yml up -d

services:
  postgres:
    image: ghcr.io/aliasvault/postgres:latest
    volumes:
      - ./database/postgres:/var/lib/postgresql/data:rw
    env_file:
      - .env
    restart: always
    environment:
      POSTGRES_DB: aliasvault
      POSTGRES_USER: aliasvault
      POSTGRES_PASSWORD_FILE: ${SECRETS_PATH:-/secrets}/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aliasvault"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  client:
    image: ghcr.io/your-org/myvault-client:latest
    volumes:
      - ./logs/msbuild:/apps/server/msbuild-logs:rw
    expose:
      - "3000"
    restart: always
    env_file:
      - .env

  api:
    image: ghcr.io/your-org/myvault-api:latest
    expose:
      - "3001"
    volumes:
      - ./database:/database:rw
      - ./logs:/logs:rw
      - ./secrets:${SECRETS_PATH:-/secrets}:ro
    restart: always
    env_file:
      - .env

  admin:
    image: ghcr.io/your-org/myvault-admin:latest
    expose:
      - "3002"
    volumes:
      - ./database:/database:rw
      - ./logs:/logs:rw
      - ./secrets:${SECRETS_PATH:-/secrets}:ro
    restart: always
    env_file:
      - .env

  reverse-proxy:
    image: ghcr.io/aliasvault/reverse-proxy:latest
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certificates:/certificates:ro
      - ./secrets:${SECRETS_PATH:-/secrets}:ro
    environment:
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-myvault.example.com}
      - UPSTREAM_CLIENT_URL=http://client:3000
      - UPSTREAM_API_URL=http://api:3001
    restart: always
    depends_on:
      - client
      - api

  smtp:
    image: ghcr.io/aliasvault/smtp:latest
    ports:
      - "${SMTP_PORT:-25}:25"
      - "${SMTP_SUBMISSION_PORT:-587}:587"
    volumes:
      - ./secrets:${SECRETS_PATH:-/secrets}:ro
      - ./logs/smtp:/logs:rw
    environment:
      - EMAIL_DOMAIN=${EMAIL_DOMAIN:-example.com}
      - SMTP_HOSTNAME=${SMTP_HOSTNAME:-mail.myvault.example.com}
    restart: always

  task-runner:
    image: ghcr.io/aliasvault/task-runner:latest
    volumes:
      - ./database:/database:rw
      - ./secrets:${SECRETS_PATH:-/secrets}:ro
    restart: always
    env_file:
      - .env
    depends_on:
      - api
      - postgres